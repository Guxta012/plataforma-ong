<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulário de cadastro da Ajuda para Aumigos.">
  <title>Cadastro - Ajuda para Aumigos</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="../js/script.js"></script>
</head>
<body>
  <header>
    <h1>Cadastro de Voluntário</h1>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <form id="formCadastro" aria-label="Formulário de Cadastro">
      <fieldset>
        <legend>Preencha suas informações</legend>

        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required aria-required="true">

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required aria-required="true">

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required aria-required="true" pattern="[0-9]{10,11}" title="Apenas números">

        <button type="submit">Enviar</button>
      </fieldset>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Ajuda para Aumigos</p>
  </footer>
</body>
</html>
